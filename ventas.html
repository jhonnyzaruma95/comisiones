<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Comisiones</title>

    <link rel="stylesheet" href="ventas.css">

    <script src="ventas.js"></script>
    <script src="utilitarios.js"></script>
</head>

<body>

    <div class="contenedor">

        <div class="encabezado">
            <div class="icono">💰</div>
            <h1>Calculadora de Comisiones</h1>
            <p>Calcula tus ingresos de manera rápida y sencilla</p>
        </div>

        <div class="formulario">

            <div class="campo">
                <label for="txtSueldoBase">Salario Base:</label>
                <input type="text" id="txtSueldoBase" placeholder="Ej: 500">
            </div>

            <div class="campo">
                <label for="txtVentas">Número de ventas:</label>
                <input type="text" id="txtVentas" placeholder="Ej: 10">
            </div>

            <div class="campo">
                <label for="txtPrecio">Precio del producto:</label>
                <input type="text" id="txtPrecio" placeholder="Ej: 50">
            </div>

            <button onclick="calcular()">
                <span>Calcular Comisión</span>
                <span class="flecha">→</span>
            </button>

        </div>

        <div class="resultados">

            <h2>Resultados</h2>

            <div class="resultado">
                <span>Salario Base</span>
                <strong id="spSueldoBase"></strong>
            </div>

            <div class="resultado">
                <span>Comisión</span>
                <strong id="spComision"></strong>
            </div>

            <div class="resultado total">
                <span>Total</span>
                <strong id="spTotal"></strong>
            </div>

        </div>

    </div>

</body>
</html>
